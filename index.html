<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Asset Transaction & Approval Management</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

  <!-- TOP NAVBAR -->
  <nav class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center shadow-md">
    <div class="flex items-center space-x-3">
      <span class="font-bold text-lg tracking-wide">Lab Asset Control System</span>
      <span id="role-badge" class="bg-indigo-600 text-xs font-semibold px-2.5 py-1 rounded-full uppercase">Guest</span>
    </div>
    <div id="auth-controls" class="flex items-center space-x-4">
      <span id="user-display-name" class="text-sm text-gray-300">Not logged in</span>
      <select id="demo-role-switcher" onchange="switchDemoRole(this.value)" class="bg-slate-800 text-sm px-3 py-1.5 rounded border border-slate-700 text-white">
        <option value="" disabled selected>Switch Demo Role...</option>
        <option value="requester">Login as Requester</option>
        <option value="staff">Login as Staff</option>
        <option value="admin">Login as Admin</option>
      </select>
    </div>
  </nav>

  <!-- DASHBOARD CONTAINER -->
  <div class="max-w-7xl mx-auto p-6">
    
    <!-- NOTIFICATION ALERT -->
    <div id="alert-box" class="hidden mb-6 p-4 rounded-md text-sm font-medium"></div>

    <!-- DYNAMIC ROLE NAVIGATION TABS (TC-A4-01, Requirement VII) -->
    <div class="flex border-b border-gray-300 mb-6 space-x-4">
      <button onclick="switchTab('catalog')" id="tab-catalog" class="py-2 px-4 font-semibold text-indigo-600 border-b-2 border-indigo-600">
        Equipment Catalog
      </button>
      <button onclick="switchTab('requests')" id="tab-requests" class="py-2 px-4 font-semibold text-gray-500 hover:text-indigo-600">
        My Requests
      </button>
      <button onclick="switchTab('queue')" id="tab-queue" class="hidden py-2 px-4 font-semibold text-gray-500 hover:text-indigo-600">
        Approval & Release Queue
      </button>
      <button onclick="switchTab('audit')" id="tab-audit" class="hidden py-2 px-4 font-semibold text-gray-500 hover:text-indigo-600">
        System Audit Logs
      </button>
    </div>

    <!-- VIEW 1: EQUIPMENT CATALOG -->
    <section id="view-catalog" class="space-y-4">
      <h2 class="text-xl font-bold">Available Equipment</h2>
      <div id="equipment-list" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- VIEW 2: MY REQUESTS (Requester View) -->
    <section id="view-requests" class="hidden space-y-4">
      <h2 class="text-xl font-bold">My Borrowing Requests</h2>
      <div class="bg-white rounded-lg shadow overflow-hidden">
        <table class="w-full text-left text-sm">
          <thead class="bg-gray-50 text-gray-600 uppercase text-xs border-b">
            <tr>
              <th class="p-3">Req ID</th>
              <th class="p-3">Asset</th>
              <th class="p-3">Status</th>
              <th class="p-3">Date Requested</th>
            </tr>
          </thead>
          <tbody id="my-requests-table"></tbody>
        </table>
      </div>
    </section>

    <!-- VIEW 3: APPROVAL & RELEASE QUEUE (Staff / Admin View) -->
    <section id="view-queue" class="hidden space-y-4">
      <h2 class="text-xl font-bold">Transaction Operations Queue</h2>
      <div class="bg-white rounded-lg shadow overflow-hidden">
        <table class="w-full text-left text-sm">
          <thead class="bg-gray-50 text-gray-600 uppercase text-xs border-b">
            <tr>
              <th class="p-3">ID</th>
              <th class="p-3">Requester</th>
              <th class="p-3">Asset Tag</th>
              <th class="p-3">Current Status</th>
              <th class="p-3">Permitted Actions</th>
            </tr>
          </thead>
          <tbody id="queue-table"></tbody>
        </table>
      </div>
    </section>

    <!-- VIEW 4: SYSTEM AUDIT LOGS (Admin View - Requirement VI) -->
    <section id="view-audit" class="hidden space-y-4">
      <h2 class="text-xl font-bold text-slate-900">System Audit Trail</h2>
      <div class="bg-slate-900 text-emerald-400 rounded-lg shadow p-4 font-mono text-xs overflow-x-auto">
        <table class="w-full text-left">
          <thead class="border-b border-slate-700 text-slate-400">
            <tr>
              <th class="p-2">Log ID</th>
              <th class="p-2">Timestamp</th>
              <th class="p-2">User ID</th>
              <th class="p-2">Action</th>
              <th class="p-2">Module</th>
              <th class="p-2">Record ID</th>
              <th class="p-2">Description</th>
            </tr>
          </thead>
          <tbody id="audit-table"></tbody>
        </table>
      </div>
    </section>

  </div>

  <!-- APPLICATION LOGIC -->
  <script>
    // 1. CONFIGURATION (Replace with your actual Supabase credentials)
    const SUPABASE_URL = "https://vrgbebaryvfxvuqdwizj.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_ISzvftOM-pv-9eNzMv_ceA_ycI8b4pW";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Mock Active User State (For Demonstration)
    let currentUser = {
      id: "c0487df0-de76-475a-a662-0d8877f5acdb",
      full_name: "Admin Test",
      role: "admin" // Options: 'requester', 'staff', 'admin'
    };

    // 2. ROLE SWITCHER & UI PERMISSIONS (Requirement VII)
    // Function: Adapt Navigation and View Permissions Based on Role
function switchDemoRole(role) {
  currentUser.role = role;

  // Update UI Header Indicators
  document.getElementById('role-badge').innerText = role;
  document.getElementById('user-display-name').innerText = `Role: ${role.toUpperCase()}`;

  // 1. Get Navigation Tab Elements
  const catalogTab = document.getElementById('tab-catalog');
  const requestsTab = document.getElementById('tab-requests');
  const queueTab    = document.getElementById('tab-queue');
  const auditTab    = document.getElementById('tab-audit');

  // 2. Define Granular Role Permissions
  const canViewOperationalQueue = (role === 'staff' || role === 'admin');
  const canViewManagementAndAudit = (role === 'admin');

  // 3. Apply Navigation Visibility Constraints
  // Requesters see only Equipment Catalog & My Requests
  catalogTab.classList.remove('hidden');
  requestsTab.classList.remove('hidden');

  // Staff & Admin see Operational Functions (Queue)
  queueTab.classList.toggle('hidden', !canViewOperationalQueue);

  // Administrators see Management & Audit Functions (Audit Trail)
  auditTab.classList.toggle('hidden', !canViewManagementAndAudit);

  // 4. Default View Reset & Safety Check
  // If user switches to a role that cannot view their active tab, send them to catalog
  if (role === 'requester') {
    switchTab('catalog');
  } else {
    switchTab('catalog');
  }

  showAlert(`Navigation adapted for role: ${role.toUpperCase()}`, 'success');
  refreshAllViews();
}

// Function: Tab View Handler
function switchTab(tabName) {
  // Prevent unauthorized tab viewing
  if (tabName === 'queue' && currentUser.role === 'requester') return;
  if (tabName === 'audit' && currentUser.role !== 'admin') return;

  const views = ['catalog', 'requests', 'queue', 'audit'];

  views.forEach(view => {
    const viewEl = document.getElementById(`view-${view}`);
    const tabEl  = document.getElementById(`tab-${view}`);

    if (viewEl) viewEl.classList.add('hidden');
    if (tabEl) {
      tabEl.className = "py-2 px-4 font-semibold text-gray-500 hover:text-indigo-600";
    }
  });

  // Activate Selected View
  const targetView = document.getElementById(`view-${tabName}`);
  const targetTab  = document.getElementById(`tab-${tabName}`);

  if (targetView) targetView.classList.remove('hidden');
  if (targetTab) {
    targetTab.className = "py-2 px-4 font-semibold text-indigo-600 border-b-2 border-indigo-600";
  }
}

    // 3. UI RENDERING & WORKFLOW ENFORCEMENT
    async function refreshAllViews() {
      fetchEquipment();
      fetchMyRequests();
      fetchQueue();
      if (currentUser.role === 'admin') fetchAuditLogs();
    }

    // View Catalog & Request Action (BR-A4-01, BR-A4-09)
    async function fetchEquipment() {
      const { data: equipment, error } = await client.from('equipment').select('*');
      const container = document.getElementById('equipment-list');
      container.innerHTML = '';

      if (error || !equipment) return;

      equipment.forEach(item => {
        const isAvailable = item.status === 'Available';
        container.innerHTML += `
          <div class="bg-white border rounded-lg p-4 shadow-sm flex flex-col justify-between">
            <div>
              <span class="text-xs font-bold text-gray-400 uppercase">${item.asset_tag}</span>
              <h3 class="font-semibold text-lg">${item.name}</h3>
              <p class="text-sm mt-1">Status: 
                <span class="font-bold ${isAvailable ? 'text-green-600' : 'text-amber-600'}">${item.status}</span>
              </p>
            </div>
            <button 
              onclick="submitRequest(${item.id})" 
              ${!isAvailable ? 'disabled' : ''} 
              class="mt-4 w-full py-2 px-4 text-sm font-medium rounded text-white ${isAvailable ? 'bg-indigo-600 hover:bg-indigo-700' : 'bg-gray-300 cursor-not-allowed'}">
              ${isAvailable ? 'Submit Borrowing Request' : 'Not Available'}
            </button>
          </div>
        `;
      });
    }

    // Submit Request (BR-A4-01 validation via Trigger)
    async function submitRequest(equipmentId) {
      const { data, error } = await client.from('borrowing_requests').insert([
        { requester_id: currentUser.id, equipment_id: equipmentId, status: 'Pending' }
      ]);

      if (error) {
        showAlert(error.message, 'error');
      } else {
        showAlert('Borrowing request submitted successfully as Pending!', 'success');
        refreshAllViews();
      }
    }

    // Render User History
    async function fetchMyRequests() {
      const { data: requests } = await client.from('borrowing_requests').select('*, equipment(name, asset_tag)');
      const tbody = document.getElementById('my-requests-table');
      tbody.innerHTML = '';

      if (!requests) return;

      requests.filter(r => r.requester_id === currentUser.id).forEach(r => {
        tbody.innerHTML += `
          <tr class="border-b">
            <td class="p-3 font-mono text-xs">#${r.id}</td>
            <td class="p-3 font-medium">${r.equipment?.name || 'N/A'} (${r.equipment?.asset_tag})</td>
            <td class="p-3"><span class="px-2 py-1 bg-gray-100 rounded text-xs font-bold">${r.status}</span></td>
            <td class="p-3 text-xs text-gray-500">${new Date(r.requested_at).toLocaleString()}</td>
          </tr>
        `;
      });
    }

    // Operations Queue (BR-A4-02 to BR-A4-08 workflow execution)
    async function fetchQueue() {
      const { data: requests } = await client.from('borrowing_requests').select('*, equipment(name, asset_tag), profiles(full_name)');
      const tbody = document.getElementById('queue-table');
      tbody.innerHTML = '';

      if (!requests) return;

      requests.forEach(r => {
        let actionButtons = '';

        // Administrator Actions (BR-A4-03)
        if (currentUser.role === 'admin' && r.status === 'Pending') {
          actionButtons += `
            <button onclick="updateStatus(${r.id}, 'Approved')" class="bg-green-600 hover:bg-green-700 text-white px-2 py-1 rounded text-xs mr-1">Approve</button>
            <button onclick="updateStatus(${r.id}, 'Rejected')" class="bg-red-600 hover:bg-red-700 text-white px-2 py-1 rounded text-xs">Reject</button>
          `;
        }

        // Release Processing (BR-A4-04, BR-A4-05)
        if ((currentUser.role === 'admin' || currentUser.role === 'staff') && r.status === 'Approved') {
          actionButtons += `
            <button onclick="updateStatus(${r.id}, 'Released')" class="bg-blue-600 hover:bg-blue-700 text-white px-2 py-1 rounded text-xs">Process Release</button>
          `;
        }

        // Return Processing (BR-A4-06, BR-A4-08)
        if ((currentUser.role === 'admin' || currentUser.role === 'staff') && r.status === 'Released') {
          actionButtons += `
            <button onclick="updateStatus(${r.id}, 'Returned')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-2 py-1 rounded text-xs">Process Return</button>
          `;
        }

        tbody.innerHTML += `
          <tr class="border-b">
            <td class="p-3 font-mono text-xs">#${r.id}</td>
            <td class="p-3 font-medium">${r.profiles?.full_name || 'User'}</td>
            <td class="p-3">${r.equipment?.asset_tag}</td>
            <td class="p-3"><span class="px-2 py-1 bg-gray-100 rounded text-xs font-bold">${r.status}</span></td>
            <td class="p-3">${actionButtons || '<span class="text-xs text-gray-400">No pending actions</span>'}</td>
          </tr>
        `;
      });
    }

    // Central Status Transition Handler
    async function updateStatus(requestId, newStatus) {
  // Execute State Update in Supabase
  const { data, error } = await client
    .from('borrowing_requests')
    .update({ status: newStatus, updated_at: new Date().toISOString() })
    .eq('id', requestId)
    .select();

  if (error) {
    showAlert(error.message, 'error');
  } else {
    // Record System Audit Log Entry (Requirement VI, BR-A4-10)
    await client.from('audit_logs').insert([
      {
        user_id: currentUser.id,
        action: newStatus.toUpperCase(),
        module: 'Borrowing',
        record_id: requestId,
        description: `Updated status of borrowing request #${requestId} to ${newStatus}`
      }
    ]);

    showAlert(`Request #${requestId} successfully updated to ${newStatus}!`, 'success');
    
    // Refresh table data across views
    await refreshAllViews();
  }
}

    // Fetch Audit Log Table (Requirement VI)
    async function fetchAuditLogs() {
      const { data: logs } = await client.from('audit_logs').select('*').order('created_at', { ascending: false });
      const tbody = document.getElementById('audit-table');
      tbody.innerHTML = '';

      if (!logs) return;

      logs.forEach(log => {
        tbody.innerHTML += `
          <tr class="border-b border-slate-800">
            <td class="p-2">#${log.id}</td>
            <td class="p-2 text-slate-400">${new Date(log.created_at).toLocaleTimeString()}</td>
            <td class="p-2 font-mono text-slate-300">${log.user_id ? log.user_id.substring(0,8)+'...' : 'System'}</td>
            <td class="p-2 font-bold text-indigo-400">${log.action}</td>
            <td class="p-2">${log.module}</td>
            <td class="p-2">#${log.record_id}</td>
            <td class="p-2 text-slate-300">${log.description}</td>
          </tr>
        `;
      });
    }

    // Helper: System Alert Popup
    function showAlert(msg, type = 'error') {
      const box = document.getElementById('alert-box');
      box.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');
      
      if (type === 'error') {
        box.classList.add('bg-red-100', 'text-red-700');
      } else {
        box.classList.add('bg-green-100', 'text-green-700');
      }
      
      box.innerText = msg;
      setTimeout(() => box.classList.add('hidden'), 5000);
    }

    // Initial Load
    switchDemoRole('requester');
  </script>
</body>
</html>
